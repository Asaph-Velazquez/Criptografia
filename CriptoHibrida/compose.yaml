services:
  nexo:
    image: ${NEXO_IMAGE:-nexo:local}
    build: .
    ports:
      - "${NEXO_BIND_ADDRESS:-127.0.0.1}:${NEXO_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend-tests:
    profiles: [test]
    build:
      context: .
      target: frontend
    command: ["sh", "-c", "npm run lint && npm test && npm run build"]

  backend-tests:
    profiles: [test]
    build:
      context: .
      target: backend
    command: ["mvn", "-B", "-ntp", "test"]

  integration-tests:
    profiles: [test]
    build:
      context: .
      target: frontend
    environment:
      TEST_BASE_URL: http://nexo:8080
    depends_on:
      nexo:
        condition: service_healthy
    command: ["npm", "run", "test:integration"]
