services:
  nexo:
    image: ${NEXO_IMAGE:-nexo:local}
    build: .
    ports:
      - "${NEXO_BIND_ADDRESS:-127.0.0.1}:${NEXO_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
